name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: bash -n
        run: |
          bash -n install.sh
          bash -n lib/dc-common.sh
          bash -n scripts/pack-release.sh scripts/print-release-shas.sh
          bash -n bin/dc-up bin/dc-exec bin/dc-down bin/dc-ps bin/dc-forward
          bash -n bin/dc-ls bin/dc-open bin/dc-tui bin/dc-df bin/dc-prune
      - name: go test dc-tui
        run: go test ./cmd/dc-tui
      - name: go build dc-tui
        run: go build -o /tmp/dc-tui ./cmd/dc-tui
      - name: install to prefix
        run: |
          PREFIX="$RUNNER_TEMP/dc-bin" bash install.sh --prefix "$RUNNER_TEMP/dc-bin"
          test -x "$RUNNER_TEMP/dc-bin/dc-up"
          test -x "$RUNNER_TEMP/dc-bin/dc-down"
          test -x "$RUNNER_TEMP/dc-bin/dc-ls"
          test -x "$RUNNER_TEMP/dc-bin/dc-open"
          test -x "$RUNNER_TEMP/dc-bin/dc-tui"
          test -f "$HOME/.config/devcontainer/dc-common.sh"
          "$RUNNER_TEMP/dc-bin/dc-up" --help
          "$RUNNER_TEMP/dc-bin/dc-down" --help
          "$RUNNER_TEMP/dc-bin/dc-ls" --help
          "$RUNNER_TEMP/dc-bin/dc-open" --help
          "$RUNNER_TEMP/dc-bin/dc-tui" --help
      - name: dc-ls empty json
        run: |
          PREFIX="$RUNNER_TEMP/dc-bin" bash install.sh --prefix "$RUNNER_TEMP/dc-bin" >/dev/null
          out="$("$RUNNER_TEMP/dc-bin/dc-ls" --json --all)"
          test "$out" = "[]"
      - name: dc-down --all refuses without --yes
        run: |
          set +e
          "$RUNNER_TEMP/dc-bin/dc-down" --all
          test $? -eq 2
      - name: dc-open --attach teaches Zed path
        run: |
          PREFIX="$RUNNER_TEMP/dc-bin" bash install.sh --prefix "$RUNNER_TEMP/dc-bin" >/dev/null
          ws="$RUNNER_TEMP/attach-ws"
          mkdir -p "$ws"
          empty="$RUNNER_TEMP/no-editors"
          mkdir -p "$empty/.config/devcontainer"
          cp lib/dc-common.sh "$empty/.config/devcontainer/dc-common.sh"
          set +e
          out="$(PATH="/usr/bin:/bin" HOME="$empty" \
            "$RUNNER_TEMP/dc-bin/dc-open" --attach "$ws" 2>&1)"
          rc=$?
          set -e
          test "$rc" -eq 2
          printf '%s\n' "$out" | grep -q 'Connect Dev Container'
          printf '%s\n' "$out" | grep -q 'Sublime cannot attach'
          ! printf '%s\n' "$out" | grep -q 'Zed/Sublime cannot attach'
          zb="$RUNNER_TEMP/fake-zed"
          mkdir -p "$zb"
          printf '#!/bin/sh\n' >"$zb/zed"
          chmod +x "$zb/zed"
          set +e
          out="$(PATH="$zb:/usr/bin:/bin" HOME="$empty" \
            "$RUNNER_TEMP/dc-bin/dc-open" --attach "$ws" 2>&1)"
          rc=$?
          set -e
          test "$rc" -eq 0
          printf '%s\n' "$out" | grep -q 'Connect Dev Container'
          ! printf '%s\n' "$out" | grep -q 'cannot attach'
      - name: help flags
        run: |
          bash install.sh --help | grep -q -- --full
          bash install.sh --help | grep -q -- --ref
      - name: pack linux-amd64 and install without go
        run: |
          scripts/pack-release.sh 0.0.0-ci linux amd64 "$RUNNER_TEMP/dc-dist"
          tar -tzf "$RUNNER_TEMP/dc-dist/dc-cli-0.0.0-ci-linux-amd64.tar.gz" | grep -q '/bin/dc-tui$'
          mkdir -p "$RUNNER_TEMP/dc-kit"
          tar -xzf "$RUNNER_TEMP/dc-dist/dc-cli-0.0.0-ci-linux-amd64.tar.gz" -C "$RUNNER_TEMP/dc-kit"
          kit="$RUNNER_TEMP/dc-kit/dc-cli-0.0.0-ci-linux-amd64"
          test "$(head -c 2 "$kit/bin/dc-tui")" != "#!"
          PATH="/usr/bin:/bin" HOME="$RUNNER_TEMP/prebuilt-home" PREFIX="$RUNNER_TEMP/dc-prebuilt" \
            bash "$kit/install.sh" --prefix "$RUNNER_TEMP/dc-prebuilt" --with-skill
          test -x "$RUNNER_TEMP/dc-prebuilt/dc-tui"
          test "$(head -c 2 "$RUNNER_TEMP/dc-prebuilt/dc-tui")" != "#!"
          "$RUNNER_TEMP/dc-prebuilt/dc-tui" --help
          "$RUNNER_TEMP/dc-prebuilt/dc-up" --help
          test -f "$kit/skill/SKILL.md"
          test -f "$RUNNER_TEMP/prebuilt-home/.agents/skills/devcontainer-cli-global/SKILL.md"
          brew="$RUNNER_TEMP/dc-brew"
          mkdir -p "$brew/bin" "$brew/lib"
          cp "$kit/bin/"* "$brew/bin/"
          cp "$kit/lib/dc-common.sh" "$brew/lib/"
          HOME="$RUNNER_TEMP/empty-home" "$brew/bin/dc-up" --help
          HOME="$RUNNER_TEMP/empty-home" "$brew/bin/dc-ls" --json --all | grep -qx '\[\]'
          grep -Fqx 'curl -fsSL https://raw.githubusercontent.com/Brasth/dc-cli/main/install.sh | bash -s -- --with-cli' README.md
      - name: dc-up missing CLI prints advertised curl
        run: |
          line='curl -fsSL https://raw.githubusercontent.com/Brasth/dc-cli/main/install.sh | bash -s -- --with-cli'
          set +e
          out="$(PATH="/usr/bin:/bin" HOME="$RUNNER_TEMP/no-cli" ./bin/dc-up /tmp 2>&1)"
          rc=$?
          set -e
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -Fqx "  $line"
